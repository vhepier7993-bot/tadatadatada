<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tadatadatada</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #fafafa;
    color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #141414; color: #f0f0f0; }
    .card { border-color: #333; }
  }
  .card {
    text-align: center;
    padding: 2.5rem 2rem;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    max-width: 32rem;
  }
  h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
  p { margin: 0; opacity: .7; line-height: 1.6; }
</style>
</head>
<body>
  <div class="card">
    <h1>tadatadatada</h1>
    <p>게임 준비 중입니다.<br>곧 이 주소에서 플레이할 수 있습니다.</p>
  </div>
</body>
</html>
